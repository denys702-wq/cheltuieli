<style>

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;min-height:100%}

.dng{background:var(--r);color:#fff;border-color:var(--r)}

.fab{position:fixed;right:18px;bottom:calc(114px + env(safe-area-inset-bottom,0px));z-index:4;width:60px;height:60px;border-radius:30px;padding:0;font-size:32px;background:var(--accent);color:var(--on);border:0;box-shadow:0 6px 18px rgba(0,0,0,.28)}

.sheet input,.sheet select{display:block;width:100%;min-height:46px;margin-top:4px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);padding:0 12px;font-size:16px;color:var(--text)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.seg button.on{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sheet h2{margin:0 0 4px;font-size:20px}.sheet h3{margin:18px 0 4px;font-size:16px}.hint{color:var(--muted);font-size:14px;margin:6px 0}.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.hd h2{margin:0;font-size:18px}.gear{width:44px;padding:0;font-size:20px}
.plan{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:12px}.plan h3{margin:0 0 6px;font-size:16px;display:flex;justify-content:space-between;gap:8px}.pr{display:flex;gap:8px;margin-top:6px}.pr .row{margin:0;flex:1;background:var(--bg)}.pay{min-width:48px;padding:0 10px;font-weight:600}.late{color:var(--r)}
.donut{display:block;margin:0 auto 6px;width:min(60vw,220px);height:auto;color:var(--text)}.lg{display:flex;align-items:center;gap:8px}.dot{width:12px;height:12px;border-radius:4px;flex:none}.note{color:var(--muted);font-size:14px;margin:8px 0}.over{color:var(--r);font-weight:600}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(30px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:5px;background:var(--card);border:1px solid var(--bd);border-radius:30px;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:4}.dock button{border:0;background:transparent;min-height:46px;padding:0 22px;border-radius:24px;font-weight:600;color:var(--muted)}.dock button.on{background:var(--accent);color:var(--on)}.menu{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:14px;text-align:left}
.hd{margin-bottom:12px}.hd small{display:block;color:var(--muted);font-size:14px}.hd h2{font-size:24px;font-weight:750;letter-spacing:-.3px}
.gear{width:46px;height:46px;border-radius:23px;font-size:20px}
.nav button{border-radius:23px;width:46px;height:46px}.nav h1{font-size:19px}
.sum{background:linear-gradient(140deg,var(--h1),var(--h2));color:#fff;border:0;border-radius:24px;padding:20px;box-shadow:0 10px 24px rgba(15,118,110,.28)}
.sum span{color:rgba(255,255,255,.85)}.sum .big{color:#fff;font-size:36px;margin:2px 0 14px}.sum .two>div{background:rgba(255,255,255,.16);border-radius:16px;padding:10px 12px}.sum b{color:#fff;font-size:16px}
.card,.plan{border-radius:22px}.row{border-radius:16px;gap:12px}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;font-style:normal;flex:none}
.rt{flex:1;min-width:0;text-align:left}
.pig{display:block;font-size:52px;margin-bottom:8px}
.pager{overflow:hidden;touch-action:pan-y}.track{display:flex;width:300%;will-change:transform}.pane{width:33.3333%;flex:none}.pane.off{height:0;overflow:hidden}
.donut circle:not(:first-child){animation:draw .9s cubic-bezier(.3,.7,.2,1) both}
@keyframes draw{from{stroke-dasharray:0 400}}
.tr{height:12px;border-radius:6px}.tr i{border-radius:6px;animation:grow .8s cubic-bezier(.3,.7,.2,1) both}
@keyframes grow{from{width:0}}
button:active{transform:scale(.97)}
#ov .sheet::before{content:"";display:none;width:40px;height:5px;border-radius:3px;background:var(--bd);margin:0 auto 10px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}.mh h2{margin:0}.mr{display:flex;gap:6px}
.nb{min-height:40px;padding:0 14px;border-radius:20px;font-weight:650}.nb.done{background:var(--accent);color:var(--on);border-color:var(--accent)}
#ov,#st,#bkp,#acc,#cat{align-items:center;padding:16px}
#ov .sheet,#st .sheet,#bkp .sheet,#acc .sheet,#cat .sheet{border-radius:24px;max-width:440px;max-height:86%;animation:pop .22s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.top{touch-action:pan-y}html,body{overflow-x:hidden}
.mir{animation:inr .28s cubic-bezier(.22,.8,.3,1) both}.mil{animation:inl .28s cubic-bezier(.22,.8,.3,1) both}
@keyframes inr{from{transform:translateX(70px);opacity:0}}@keyframes inl{from{transform:translateX(-70px);opacity:0}}
.dock button{position:relative;z-index:1;flex:1;transition:color .3s}.dock button.on{background:transparent;color:var(--on)}
.ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 18px)/3);border-radius:24px;background:var(--accent);box-shadow:0 3px 10px rgba(15,118,110,.35)}
.dock{width:min(320px,calc(100% - 40px))}
.dock button{min-height:58px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;flex:1 1 0;min-width:0;text-align:center}
.dock svg{display:block}
input[type=date]{-webkit-appearance:none;appearance:none;text-align:left;display:block;width:100%;min-height:46px}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0;min-height:1.4em}
input[type=date]::-webkit-datetime-edit{padding:0}
.mir{animation:inr .24s cubic-bezier(.22,.8,.3,1) both}.mil{animation:inl .24s cubic-bezier(.22,.8,.3,1) both}
@keyframes inr{from{transform:translateX(56px)}}@keyframes inl{from{transform:translateX(-56px)}}
.noanim .donut circle,.noanim .tr i{animation:none}
#splash{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(160deg,var(--h1),var(--h2));color:#fff;transition:opacity .45s ease,transform .45s ease}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.sp-pig{font-size:88px;line-height:1;animation:pigin .8s cubic-bezier(.3,1.4,.5,1) both,bob 1.4s ease-in-out .8s infinite}
.sp-name{font-size:28px;font-weight:750;letter-spacing:-.3px;animation:fadeup .6s .3s both}
.sp-dots{display:flex;gap:8px;margin-top:6px;animation:fadeup .6s .5s both}
.sp-dots i{width:9px;height:9px;border-radius:50%;background:#fff;opacity:.5;animation:dotp 1s ease-in-out infinite}
.sp-dots i:nth-child(2){animation-delay:.15s}.sp-dots i:nth-child(3){animation-delay:.3s}
@keyframes pigin{from{transform:scale(.2) rotate(-25deg);opacity:0}}
@keyframes bob{50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}}
@keyframes dotp{50%{opacity:1;transform:scale(1.35)}}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}}
@keyframes dockin{from{opacity:0;transform:translate(-50%,40px)}}
@keyframes fabin{from{opacity:0;transform:scale(.3)}}
.go .hd{animation:rise .6s cubic-bezier(.22,.8,.3,1) .35s both}
.go .top{animation:rise .65s cubic-bezier(.22,.8,.3,1) .45s both}
.go .plan{animation:rise .6s cubic-bezier(.22,.8,.3,1) .6s both}
.go .pane .card,.go .pane .empty{animation:rise .6s cubic-bezier(.22,.8,.3,1) .72s both}
.go .pane .row{animation:rise .5s cubic-bezier(.22,.8,.3,1) .7s both}
.go .dock{animation:dockin .6s cubic-bezier(.22,.8,.3,1) .85s both}
.go .fab{animation:fabin .5s cubic-bezier(.3,1.5,.5,1) 1s both}
.go .donut circle:not(:first-child){animation-delay:.9s}.go .tr i{animation-delay:.95s}
.plan{padding:10px 12px}.plan h3{margin:0 2px 2px}.plan .row{min-height:52px;padding:8px 12px}
.plm{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .32s cubic-bezier(.22,.8,.3,1),visibility 0s .32s}
.plan.open .plm{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .32s cubic-bezier(.22,.8,.3,1),visibility 0s}
.pli{overflow:hidden;min-height:0}
.plt{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:6px;min-height:40px;border:0;background:transparent;color:var(--accent);font-weight:650;border-radius:12px}
.chev{font-style:normal;display:inline-block;transition:transform .28s}.plan.open .chev{transform:rotate(180deg)}
.pr .row{width:auto;min-width:0;flex:1 1 0}.pay{flex:none;width:48px;min-width:48px;padding:0}.pr .row small{overflow-wrap:anywhere}
.scope{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0 0 10px}
.scope button{min-height:38px;padding:0 6px;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:19px}
.scope button.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:4px 0 2px}
.seg3 button{min-height:44px;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg3 button.on{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600}.seg3 button:disabled{opacity:.4}
.setl{margin-bottom:12px}.setl h3{margin:0 0 6px;font-size:16px}.setx{margin:6px 0 0;font-weight:700}
.code{font-size:26px;letter-spacing:4px;font-weight:800;text-align:center;margin:8px 0;user-select:all}
#acc .sheet label{margin-top:8px}
.modeb{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:10px;min-height:46px;font-weight:650}
.bcard{margin-bottom:12px}.bcard h3{margin:0 0 6px;font-size:16px;display:flex;justify-content:space-between;gap:8px}.bcard .row{margin-top:6px}
.brow{display:flex;width:100%;align-items:flex-start;gap:12px;text-align:left;margin-top:8px;padding:10px 12px;border-radius:16px;min-height:64px}
.bm{flex:1;min-width:0;display:block}.bl2{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}.brow .tr{display:block}
.brow small{display:block;margin-top:4px;color:var(--muted);font-size:13px}.brow small.late{color:var(--r)}
.emos{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.emos button{min-height:40px;min-width:40px;padding:0;font-size:20px;border-radius:12px}
.bl2>span{white-space:nowrap;font-size:14px;color:var(--muted)}.bl2 b{min-width:0;overflow:hidden;text-overflow:ellipsis}
.fab{transition:transform .25s,opacity .25s}.fab.hide{opacity:0;transform:scale(.3);pointer-events:none}.fab.open{transform:rotate(45deg)}
.fabb{position:fixed;inset:0;z-index:3}.fabb[hidden],.fabm[hidden]{display:none}
.fabm{position:fixed;right:18px;bottom:calc(184px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;flex-direction:column;gap:8px;align-items:flex-end}

#ov .seg{grid-template-columns:repeat(3,1fr)}#ov .seg button{font-size:15px;padding:0 6px}.seg[hidden],.seg button[hidden]{display:none}
:root{color-scheme:light dark}
.sp-pig img{display:block;width:104px;height:104px;border-radius:24px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.sum{position:relative;overflow:hidden}.sum::before{content:"";position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}.sum>*{position:relative}
.ovr{margin:4px 0 10px}.ovr .bl2{font-size:14px;color:var(--muted)}

.sum b{font-size:13px;white-space:nowrap;overflow-wrap:normal}.sum .two>div{padding:8px 8px}.sum{padding:16px}

}
</style>
</head>

function load(){
 try{localStorage.setItem('_t','1');localStorage.removeItem('_t');
  const r=localStorage.getItem(KEY);
  if(r){const o=JSON.parse(r);U=+o.u||((o.tx&&o.tx.length)||(o.planned&&o.planned.length)||(o.subs&&o.subs.length)?1:0);if(Array.isArray(o.tx))tx=o.tx;if(Array.isArray(o.planned))pl=o.planned;if(Array.isArray(o.subs))subs=o.subs;if(Array.isArray(o.cats))cats=o.cats}
  const q=JSON.parse(localStorage.getItem(KEY2)||'{}');
  if(T[q.lang])S.lang=q.lang;
  if(['RON','EUR','USD','GBP','MDL'].includes(q.cur))S.cur=q.cur;
  if(typeof q.name==='string')S.name=q.name.slice(0,24);
  if(['all','me','partner','shared'].includes(q.scope))S.scope=q.scope;
 }catch(e){ok=false}
 if(!cats.length)cats=defCats();
}

 if(!DB)return;clearTimeout(pushT);

}

function render(){
 const m=tx.filter(x=>x.date.startsWith(mk(view))&&vis(x));
 const inc=sum(m,'inc'),exp=sum(m,'exp'),bal=inc-exp,hr=new Date().getHours();
 let h=(ok||DB)?'':`<div class="warn">${t('nostore')}</div>`;
 if(C.syncErr)h+=`<div class="warn">${t('syncErr')}</div>`;
 h+=`<div class="hd"><div><small>${t('app')}</small><h2>${t(hr<12?'gm':hr<18?'ga':'ge')}${S.name?', '+esc(S.name):''} 👋</h2></div><button class="gear" data-act="set" aria-label="${t('set')}">⚙️</button></div>`;
 h+=scopeBar();
 const an=mAnim?(mAnim>0?' mir':' mil'):'';
 h+=`<div id="top" class="top${an}"><div class="nav"><button data-act="prev" aria-label="${t('prev')}">‹</button><h1>${mt(view)}</h1><button data-act="next" aria-label="${t('next')}">›</button></div>`;

 h+=`<div class="pager${an}${mAnim?' noanim':''}" id="pgr"><div class="track" id="trk"><section class="pane" id="p-home">${planCard()+budAlert()+settleCard(mk(view))+charts(m,inc,exp)}</section><section class="pane" id="p-hist">${list(m)}</section><section class="pane" id="p-bud">${budgetPane()}</section></div></div>`;
 $('#app').innerHTML=h;
 document.querySelectorAll('.dock button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
 place(false);
}
let offT=0,mAnim=0,busy=false,paT=0;
const TABS=['home','hist','bud'],TI=()=>TABS.indexOf(tab);
function ind(p,anim){const e=$('.ind');if(!e)return;e.style.transition=anim?'transform .38s cubic-bezier(.22,.8,.3,1)':'none';e.style.transform=`translateX(calc(${p*100}% + ${p*4}px))`}
function goMonth(d){view.setMonth(view.getMonth()+d);mAnim=d;render();mAnim=0}
function offAll(on){TABS.forEach(k=>{const e=$('#p-'+k);if(e)e.classList.toggle('off',on&&tab!==k)})}
function setOff(){offAll(true)}
function place(anim){
 const tr=$('#trk');if(!tr)return;
 tr.style.transition=anim?'transform .38s cubic-bezier(.22,.8,.3,1)':'none';
 tr.style.transform=`translateX(${-TI()*100/3}%)`;
 ind(TI(),anim);fabUpdate();
 clearTimeout(offT);
 if(anim){offAll(false);offT=setTimeout(setOff,430)}else setOff();
}
function switchTab(k){
 if(k!==tab){tab=k;window.scrollTo(0,0)}
 document.querySelectorAll('.dock button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
 place(true);
}
let sx=0,sy=0,dx=0,lk='',zn='';
document.addEventListener('touchstart',e=>{
 zn=e.target.closest('.pager')?'p':e.target.closest('#top')?'t':'';
 if(!zn||e.touches.length!==1||busy){lk='x';return}
 sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;lk='';
},{passive:true});
document.addEventListener('touchmove',e=>{
 if(lk==='x'||lk==='v')return;
 const x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;
 if(!lk){
  if(Math.abs(x)<8&&Math.abs(y)<8)return;
  lk=Math.abs(x)>Math.abs(y)?'h':'v';
  if(lk==='h'){
   if(zn==='p'){offAll(false);$('#trk').style.transition='none'}
   else $('#top').style.transition='none';
  }
 }
 if(lk!=='h')return;
 if(zn==='p'){
  const i=TI(),w=$('#pgr').offsetWidth;
  dx=((i===0&&x>0)||(i===TABS.length-1&&x<0))?x*.3:x;
  $('#trk').style.transform=`translateX(calc(${-i*100/3}% + ${dx}px))`;
  ind(Math.min(TABS.length-1,Math.max(0,i-dx/w)),false);
 }else{dx=x;$('#top').style.transform=`translateX(${dx}px)`}
},{passive:true});
function endTouch(){
 if(lk==='h'){const w=window.innerWidth;
  if(zn==='p'){
   if(dx<-w*.18&&TI()<TABS.length-1)switchTab(TABS[TI()+1]);
   else if(dx>w*.18&&TI()>0)switchTab(TABS[TI()-1]);
   else place(true);
  }else if(Math.abs(dx)>w*.2)goMonth(dx<0?1:-1);
  else{const el=$('#top');el.style.transition='transform .25s ease-out';el.style.transform='translateX(0)'}
 }
 lk='';dx=0;
}
document.addEventListener('keydown',e=>{
 if(e.key!=='Enter'||e.isComposing)return;
 const id=e.target.id;
 if(id==='f-amt'||id==='f-note'){e.preventDefault();saveTx()}
 else if(id==='c-name'||id==='c-amt'||id==='c-emo'){e.preventDefault();saveCat()}
 else if(id==='s-name'){e.preventDefault();setDone()}
 else if(id==='a-pass'){e.preventDefault();accDo('signin')}
 else if(id==='a-code'){e.preventDefault();accDo('joinhome')}
});
document.addEventListener('touchend',endTouch);

const dim=ym=>new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();

const paidSub=(sb,ym)=>tx.some(r=>r.sid===sb.id&&r.sm===ym);
function monthPlan(ym){
 const a=pl.filter(x=>x.date.startsWith(ym)&&vis(x)).map(x=>({key:'p'+x.id,id:x.id,kind:'plan',amt:x.amt,cat:x.cat,date:x.date,note:x.note}));
 const b=subs.filter(sb=>sb.from<=ym&&vis(sb)&&!paidSub(sb,ym)).map(sb=>({key:'s'+sb.id,id:sb.id,kind:'sub',amt:sb.amt,cat:sb.cat,date:dueOf(sb,ym),note:sb.note}));
 return [...a,...b].sort((x,y)=>x.date.localeCompare(y.date));
}
function planCard(){
 const q=monthPlan(mk(view)),td=today(),n=q.length;
 const row=x=>{const late=x.date<td;return `<div class="pr"><button class="row" data-act="edit" data-kind="${x.kind}" data-id="${x.id}">${ic(x)}<span class="rt"><b>${esc(cn(x.cat))}</b><small class="${late?'late':''}">${x.kind==='sub'?'🔁\u00a0':''}${fd(x.date)}${late?' · '+t('late'):''}${x.note?' · '+esc(x.note):''}</small></span><em class="r">${fmt(x.amt)}</em></button><button class="pay${pa===x.key?' pri':''}" data-act="pay" data-key="${x.key}" aria-label="${t('paid')}">${pa===x.key?t('paid'):'✓'}</button></div>`};
 let h=`<div class="plan${plExp&&n>1?' open':''}"><h3><span>🗓️ ${t('pl')}</span><span>${n?fmt(q.reduce((a,x)=>a+x.amt,0)):''}</span></h3>`;
 if(!n)return h+`<p class="hint">${t('plnone')}</p></div>`;
 h+=row(q[0]);
 if(n>1)h+=`<div class="plm"><div class="pli">${q.slice(1).map(row).join('')}</div></div><button class="plt" data-act="togglePlan" aria-expanded="${plExp}"><span class="pll">${plExp?t('less'):t('all')+' ('+n+')'}</span><i class="chev">▾</i></button>`;
 return h+'</div>';
}
function togglePlan(){
 plExp=!plExp;
 const c=document.querySelector('.plan');if(!c)return;

}
function payPlan(key){
 if(pa!==key){pa=key;clearTimeout(paT);paT=setTimeout(()=>{pa='';render()},4000);render();return}
 pa='';clearTimeout(paT);
 const id=+key.slice(1),ym=mk(view),cur=ym<=mk(new Date());
 if(key[0]==='p'){
  const x=pl.find(r=>r.id===id);
  if(x){pl=pl.filter(r=>r.id!==id);tx.push({id:x.id,type:'exp',amt:x.amt,cat:x.cat,date:today(),note:x.note,...(x.own?{own:x.own}:{}),...(x.own==='shared'?{by:C.uid}:{})});save()}

function charts(m,inc,exp){
 const by={};
 m.filter(x=>x.type==='exp').forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amt);
 const e=Object.entries(by).sort((a,b)=>b[1]-a[1]);
 if(!e.length)return `<p class="empty"><span class="pig">📊</span>${t('noexp')}</p>`;
 const base=inc>0?Math.max(inc,exp):exp,den=inc>0?inc:exp,R=44,C=2*Math.PI*R;
 let off=0,svg=`<svg class="donut" viewBox="0 0 120 120" role="img" aria-label="${t('spent')}"><circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--bd)" stroke-width="18"/>`;
 e.forEach(([c,v])=>{const l=v/base*C;svg+=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${cc(c)}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=l});
 
 let cPct = 100, cTxt = t('ofexp');
 if(inc>0){
  if(inc>=exp){ cPct = Math.round((inc-exp)/inc*100); cTxt = t('avail'); }
  else{ cPct = Math.round(exp/inc*100); cTxt = t('spent'); }
 }
 svg+=`<text x="60" y="60" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">${cPct}%</text><text x="60" y="76" text-anchor="middle" font-size="9" fill="currentColor" opacity=".7">${cTxt}</text></svg>`;
 
 let h=`<div class="card">${svg}`;
 if(inc>0)h+=exp>inc?`<p class="note over">${t('over')} ${fmt(exp-inc)}</p>`:`<p class="note">${t('left')}: <b>${fmt(inc-exp)}</b> (${pc((inc-exp)/inc*100)})</p>`;
 else h+=`<p class="note">${t('noinc')}</p>`;
 h+=`<p class="note">${t('top')}: <b>${esc(cn(e[0][0]))}</b> (${pc(e[0][1]/den*100)})</p>`;
 e.forEach(([c,v])=>{const p=v/den*100;h+=`<div class="bar"><div class="bl"><span class="lg"><i class="dot" style="background:${cc(c)}"></i>${esc(catEm(c))} ${esc(cn(c))}</span><span>${fmt(v)} · ${pc(p)}</span></div><div class="tr"><i style="width:${Math.min(p,100)}%;background:${cc(c)}"></i></div></div>`});
 const pv=new Date(view);pv.setMonth(pv.getMonth()-1);
 const pt=sum(tx.filter(x=>x.date.startsWith(mk(pv))&&vis(x)),'exp');
 h+=`<p class="note">${t('last')}: ${pt?`${fmt(pt)} (${exp>=pt?'+':'−'}${fmt(Math.abs(exp-pt))})`:t('nolast')}</p>`;
 return h+'</div>';
}

function myRatio(ym){
 if(C.ratio!=='income')return .5;
 let a=0,b=0;
 tx.forEach(x=>{if(x.type!=='inc'||!x.date.startsWith(ym))return;if(x.own===C.uid)a+=x.amt;else if(C.partner&&x.own===C.partner)b+=x.amt});
 return a+b>0?a/(a+b):.5;
}
const share=(x,ym)=>{if(!C.hid||C.mode==='common')return x.amt;if(x.own==='shared')return x.amt*myRatio(ym);return(!x.own||x.own===C.uid)?x.amt:0};
function bud(c,ym,w){const ks=Object.keys(c.b||{}).filter(k=>k<=ym&&c.b[k]&&c.b[k][w]!==undefined).sort();return ks.length?(+c.b[ks[ks.length-1]][w]||0):0}

const spentIn=(n,ym)=>{let s=0;tx.forEach(x=>{if(x.type==='exp'&&x.cat===n&&x.date.startsWith(ym))s+=share(x,ym)});return s};

async function cloudInit(){
 if(!/^https?:$/.test(location.protocol)||self.origin==='null'){C.err='load';bootRes();return}
 try{
  const [A,Au,F]=await Promise.all([import(FBV+'firebase-app.js'),import(FBV+'firebase-auth.js'),import(FBV+'firebase-firestore.js')]);
  const app=A.initializeApp(FBC);
  let db;try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache()})}catch(e){db=F.getFirestore(app)}
  const auth=Au.getAuth(app);
  C.fb={A,Au,F,app,db,auth};
  Au.onAuthStateChanged(auth,u=>{onUser(u)});
 }catch(e){console.warn('cloud',e);C.err='load';renderAcc();bootRes()}
}
function detach(){C.unsubs.forEach(f=>{try{f()}catch(e){}});C.unsubs=[];C.known={tx:new Map(),planned:new Map(),subs:new Map(),cats:new Map()};C.sync=false;C.seeded=false}
async function onUser(u){
 const had=!!C.hid;
 detach();
 if(!u){
  if(had){tx=[];pl=[];subs=[];cats=defCats();wr();try{localStorage.removeItem(KEY3)}catch(e){}}
  C.uid=null;C.email='';C.hid=null;C.partner=null;C.names={};C.members=[];C.code='';
  renderAcc();render();bootRes();return;
 }
 C.uid=u.uid;C.email=u.email||'';
 try{
  const {F,db}=C.fb;
  let hid=null;
  try{const us=await F.getDoc(F.doc(db,'users',u.uid));hid=us.exists()?us.data().hid||null:null}
  catch(e){try{const k=JSON.parse(localStorage.getItem(KEY3)||'{}');if(k.uid===u.uid)hid=k.hid||null}catch(x){}}
  if(hid)attach(hid);else{C.hid=null;renderAcc();render();bootRes()}
 }catch(e){console.error(e);bootRes()}
}
function attach(hid){
 const {F,db}=C.fb;
 detach();C.hid=hid;
 try{localStorage.setItem(KEY3,JSON.stringify({uid:C.uid,hid}))}catch(e){}
 const first={h:false,tx:false,planned:false,subs:false,cats:false};
 const chk=()=>{if(first.h&&first.tx&&first.planned&&first.subs&&first.cats){C.sync=true;if(!C.seeded){C.seeded=true;if(!cats.length)cats=defCats()}bootRes();cloudPush()}};
 C.unsubs.push(F.onSnapshot(F.doc(db,'households',hid),s=>{
  if(s.exists()){const d=s.data();C.members=d.members||[];C.names=d.names||{};C.code=d.code||'';C.mode=d.mode||'split';C.ratio=d.ratio||'equal';C.partner=C.members.find(m=>m!==C.uid)||null}
  first.h=true;chk();schedRender();
 },e=>{console.error(e);first.h=true;chk()}));
 ['tx','planned','subs','cats'].forEach(k=>{
  C.unsubs.push(F.onSnapshot(F.collection(db,'households',hid,k),s=>{
   const arr=s.docs.map(d=>d.data());
   C.known[k]=new Map(arr.map(x=>[String(x.id),JSON.stringify(x)]));
   if(k==='tx')tx=arr;else if(k==='planned')pl=arr;else if(k==='subs')subs=arr;else cats=arr.sort((a,b)=>(a.ord||0)-(b.ord||0)||a.id-b.id);
   first[k]=true;wr();chk();schedRender();
  },e=>{console.error(e);first[k]=true;chk()}));
 });
}
function cloudPush(){
 if(!C.hid||!C.sync||!C.fb)return;
 const {F,db}=C.fb,ops=[];
 [['tx',tx],['planned',pl],['subs',subs],['cats',cats]].forEach(([k,arr])=>{
  const km=C.known[k],seen=new Set();
  arr.forEach(x=>{
   if(k!=='cats'&&!x.own)x.own=C.uid;
   const id=String(x.id),c=clean(x),j=JSON.stringify(c);seen.add(id);
   if(km.get(id)!==j){ops.push([0,k,id,c]);km.set(id,j)}
  });
  [...km.keys()].forEach(id=>{if(!seen.has(id)){ops.push([1,k,id]);km.delete(id)}});
 });
 for(let i=0;i<ops.length;i+=400){
  const b=F.writeBatch(db);
  ops.slice(i,i+400).forEach(([d,k,id,x])=>{const r=F.doc(db,'households',C.hid,k,id);if(d)b.delete(r);else b.set(r,x)});
  b.commit().then(()=>{if(C.syncErr){C.syncErr=false;schedRender()}},e=>{console.error('push',e);C.syncErr=true;schedRender()});
 }
}

function genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',a=new Uint32Array(8);crypto.getRandomValues(a);return [...a].map(v=>c[v%c.length]).join('')}
async function createHome(){
 const {F,db}=C.fb,hid=F.doc(F.collection(db,'households')).id,code=genCode(),now=Date.now();
 const b=F.writeBatch(db);
 b.set(F.doc(db,'households',hid),{members:[C.uid],names:{[C.uid]:S.name||''},code,createdAt:now});
 b.set(F.doc(db,'invites',code),{hid,createdAt:now});
 b.set(F.doc(db,'users',C.uid),{hid,name:S.name||''},{merge:true});
 await b.commit();
 for(const [k,arr] of [['tx',tx],['planned',pl],['subs',subs],['cats',cats]]){
  for(let i=0;i<arr.length;i+=400){
   const bb=F.writeBatch(db);
   arr.slice(i,i+400).forEach(x=>{if(k!=='cats')x.own=x.own||C.uid;bb.set(F.doc(db,'households',hid,k,String(x.id)),clean(x))});
   await bb.commit();
  }
 }
 attach(hid);
}
async function joinHome(code){
 const {F,db}=C.fb;code=String(code||'').trim().toUpperCase();
 if(!code)throw {code:'nocode'};

 if(!inv.exists())throw {code:'nocode'};
 const hid=inv.data().hid;
 try{localStorage.setItem('cheltuieli_prejoin',JSON.stringify({tx,planned:pl,subs}))}catch(e){}
 await F.updateDoc(F.doc(db,'households',hid),{members:F.arrayUnion(C.uid),['names.'+C.uid]:S.name||''});
 await F.setDoc(F.doc(db,'users',C.uid),{hid,name:S.name||''},{merge:true});
 attach(hid);
}
function fbErr(e){
 const c=(e&&e.code)||'';
 if(/invalid-credential|wrong-password|user-not-found/.test(c))return t('e_cred');
 if(/email-already-in-use/.test(c))return t('e_used');
 if(/weak-password/.test(c))return t('e_weak');
 if(/invalid-email/.test(c))return t('e_mail');
 if(/network|unavailable/.test(c))return t('e_net');
 if(c==='nocode')return t('e_code');
 if(/permission-denied/.test(c))return t('e_full');
 return t('e_gen')+(c?' ('+c+')':'');
}
async function accDo(a){

   const e=$('#a-mail').value.trim(),p=$('#a-pass').value;
   if(!e||!p){m.textContent=t('e_fill');return}
   await (a==='signin'?Au.signInWithEmailAndPassword(auth,e,p):Au.createUserWithEmailAndPassword(auth,e,p));
  }else if(a==='mkhome')await createHome();
  else if(a==='joinhome')await joinHome($('#a-code').value);

  m.textContent='';
 }catch(e){console.error(e);m.textContent=fbErr(e)}

function countUp(){

 if(sp){sp.classList.add('out');setTimeout(()=>sp.remove(),520)}
