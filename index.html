@keyframes dockin{from{opacity:0;transform:translate(-50%,40px)}}
@keyframes fabin{from{opacity:0;transform:scale(.3)}}
.go .hd{animation:rise .6s cubic-bezier(.22,.8,.3,1) .35s both}
.go .top{animation:rise .65s cubic-bezier(.22,.8,.3,1) .45s both}

.go .pane .card,.go .pane .empty{animation:rise .6s cubic-bezier(.22,.8,.3,1) .72s both}
.go .pane .row{animation:rise .5s cubic-bezier(.22,.8,.3,1) .7s both}
.go .dock{animation:dockin .6s cubic-bezier(.22,.8,.3,1) .85s both}
.go .fab{animation:fabin .5s cubic-bezier(.3,1.5,.5,1) 1s both}
.go .donut circle:not(:first-child){animation-delay:.9s}.go .tr i{animation-delay:.95s}

const EM={'Mâncare':'🍽️','Subscripții':'🔄','Combustibil':'⛽','Facturi':'🧾','Casă':'🏠','Sănătate':'💊','Distracție':'🎮','Cumpărături':'🛍️','Altele':'✨','Salariu':'💼','Bonus':'🎁'};

function charts(m,inc,exp){
 const by={};
 m.filter(x=>x.type==='exp').forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amt);
 const e=Object.entries(by).sort((a,b)=>b[1]-a[1]);

 // Calcul procent disponibil pentru Chart
 const percentAvail = inc > 0 ? (inc >= exp ? Math.round(((inc - exp) / inc) * 100) : 0) : 0;
 const centerText = inc > 0 ? `${percentAvail}%` : '100%';
 const subText = inc > 0 ? 'disponibil' : t('ofexp');
 
 let off=0,svg=`<svg class="donut" viewBox="0 0 120 120" role="img" aria-label="${t('spent')}"><circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--bd)" stroke-width="18"/>`;
 
 // Adaugam zona verde pentru disponibil in grafic daca exista venit
 if (inc > 0 && inc >= exp) {
    const availLength = (percentAvail / 100) * C;
    svg += `<circle cx="60" cy="60" r="${R}" fill="none" stroke="#22c55e" stroke-width="18" stroke-dasharray="${availLength} ${C - availLength}" stroke-dashoffset="0" transform="rotate(-90 60 60)"/>`;
    off += availLength;
 }

 e.forEach(([c,v])=>{const l=v/base*C;svg+=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${cc(c)}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=l});
 svg+=`<text x="60" y="60" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">${centerText}</text><text x="60" y="76" text-anchor="middle" font-size="9" fill="currentColor" opacity=".7">${subText}</text></svg>`;
 let h=`<div class="card">${svg}`;
 if(inc>0)h+=exp>inc?`<p class="note over">${t('over')} ${fmt(exp-inc)}</p>`:`<p class="note">${t('left')}: <b>${fmt(inc-exp)}</b> (${pc((inc-exp)/inc*100)})</p>`;
 else h+=`<p class="note">${t('noinc')}</p>`;
 h+=`<p class="note">${t('top')}: <b>${esc(cn(e[0][0]))}</b> (${pc(e[0][1]/den*100)})</p>`;
 e.forEach(([c,v])=>{const p=v/den*100;h+=`<div class="bar"><div class="bl"><span class="lg"><i class="dot" style="background:${cc(c)}"></i>${EM[c]||'✨'} ${esc(cn(c))}</span><span>${fmt(v)} · ${pc(p)}</span></div><div class="tr"><i style="width:${Math.min(p,100)}%;background:${cc(c)}"></i></div></div>`});
 const pv=new Date(view);pv.setMonth(pv.getMonth()-1);
 const pt=sum(tx.filter(x=>x.date.startsWith(mk(pv))),'exp');
 h+=`<p class="note">${t('last')}: ${pt?`${fmt(pt)} (${exp>=pt?'+':'−'}${fmt(Math.abs(exp-pt))})`:t('nolast')}</p>`;
 return h+'</div>';
}

.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;font-style:normal;flex:none}
.rt{flex:1;min-width:0;text-align:left}
.pig{display:block;font-size:52px;margin-bottom:8px}
.pager{overflow:hidden;touch-action:pan-y}.track{display:flex;width:200%;will-change:transform}.pane{width:50%;flex:none}.pane.off{height:0;overflow:hidden}
.donut circle:not(:first-child){animation:draw .9s cubic-bezier(.3,.7,.2,1) both}
@keyframes draw{from{stroke-dasharray:0 400}}
.tr{height:12px;border-radius:6px}.tr i{border-radius:6px;animation:grow .8s cubic-bezier(.3,.7,.2,1) both}
@keyframes grow{from{width:0}}
button:active{transform:scale(.97)}
#ov .sheet::before{content:"";display:none;width:40px;height:5px;border-radius:3px;background:var(--bd);margin:0 auto 10px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}.mh h2{margin:0}.mr{display:flex;gap:6px}
.nb{min-height:40px;padding:0 14px;border-radius:20px;font-weight:650}.nb.done{background:var(--accent);color:var(--on);border-color:var(--accent)}
#ov,#st,#bkp{align-items:center;padding:16px}
#ov .sheet,#st .sheet,#bkp .sheet{border-radius:24px;max-width:440px;max-height:86%;animation:pop .22s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.top{touch-action:pan-y}html,body{overflow-x:hidden}
.mir{animation:inr .28s cubic-bezier(.22,.8,.3,1) both}.mil{animation:inl .28s cubic-bezier(.22,.8,.3,1) both}
@keyframes inr{from{transform:translateX(70px);opacity:0}}@keyframes inl{from{transform:translateX(-70px);opacity:0}}
.dock button{position:relative;z-index:1;flex:1;transition:color .3s}.dock button.on{background:transparent;color:var(--on)}
.ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 14px)/2);border-radius:24px;background:var(--accent);box-shadow:0 3px 10px rgba(15,118,110,.35)}
.dock{width:min(320px,calc(100% - 40px))}
.dock button{min-height:58px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;flex:1 1 0;min-width:0;text-align:center}
.dock svg{display:block}
input[type=date]{-webkit-appearance:none;appearance:none;text-align:left;display:block;width:100%;min-height:46px}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0;min-height:1.4em}
input[type=date]::-webkit-datetime-edit{padding:0}
.mir{animation:inr .24s cubic-bezier(.22,.8,.3,1) both}.mil{animation:inl .24s cubic-bezier(.22,.8,.3,1) both}
@keyframes inr{from{transform:translateX(56px)}}@keyframes inl{from{transform:translateX(-56px)}}
.noanim .donut circle,.noanim .tr i{animation:none}
#splash{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(160deg,var(--h1),var(--h2));color:#fff;transition:opacity .45s ease,transform .45s ease}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.sp-pig{font-size:88px;line-height:1;animation:pigin .8s cubic-bezier(.3,1.4,.5,1) both,bob 1.4s ease-in-out .8s infinite}
.sp-name{font-size:28px;font-weight:750;letter-spacing:-.3px;animation:fadeup .6s .3s both}
.sp-dots{display:flex;gap:8px;margin-top:6px;animation:fadeup .6s .5s both}
.sp-dots i{width:9px;height:9px;border-radius:50%;background:#fff;opacity:.5;animation:dotp 1s ease-in-out infinite}
.sp-dots i:nth-child(2){animation-delay:.15s}.sp-dots i:nth-child(3){animation-delay:.3s}
@keyframes pigin{from{transform:scale(.2) rotate(-25deg);opacity:0}}
@keyframes bob{50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}}
@keyframes dotp{50%{opacity:1;transform:scale(1.35)}}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}}
@keyframes dockin{from{opacity:0;transform:translate(-50%,40px)}}
@keyframes fabin{from{opacity:0;transform:scale(.3)}}
.go .hd{animation:rise .6s cubic-bezier(.22,.8,.3,1) .35s both}
.go .top{animation:rise .65s cubic-bezier(.22,.8,.3,1) .45s both}
.go .plan{animation:rise .6s cubic-bezier(.22,.8,.3,1) .6s both}
.go .pane .card,.go .pane .empty{animation:rise .6s cubic-bezier(.22,.8,.3,1) .72s both}
.go .pane .row{animation:rise .5s cubic-bezier(.22,.8,.3,1) .7s both}
.go .dock{animation:dockin .6s cubic-bezier(.22,.8,.3,1) .85s both}
.go .fab{animation:fabin .5s cubic-bezier(.3,1.5,.5,1) 1s both}
.go .donut circle:not(:first-child){animation-delay:.9s}.go .tr i{animation-delay:.95s}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><div class="sp-pig">🐷</div><div class="sp-name" data-i="app"></div><div class="sp-dots"><i></i><i></i><i></i></div></div>
<script>setTimeout(function(){var s=document.getElementById("splash");if(s)s.style.display="none"},7000)</script>
<div class="wrap"><div id="app"></div></div>
<nav class="dock"><i class="ind"></i><button data-tab="home"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.4 6.4"/></svg><span data-i="hom"></span></button><button data-tab="hist"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-i="his"></span></button></nav>
<button class="fab" data-act="add">+</button>
<div id="ov" class="ov" hidden>
 <div class="sheet" role="dialog">
  <div class="mh"><h2 data-i="txt"></h2><div class="mr"><button class="nb" data-act="close" aria-label="Back">‹</button><button class="nb done" data-act="save" data-i="done"></button></div></div>
  <div id="err" class="err"></div>
  <div class="seg"><button data-type="exp" data-i="e1"></button><button data-type="inc" data-i="i1"></button><button data-type="plan" data-i="p1"></button></div>
  <label><span id="l-amt"></span><input id="f-amt" inputmode="decimal" autocomplete="off"></label>
  <label><span data-i="cat"></span><select id="f-cat"></select></label>
  <label><span id="l-date"></span><input id="f-date" type="date"></label>
  <label><span data-i="note"></span><input id="f-note" maxlength="80" autocomplete="off"></label>
  <div class="btns"><button id="del" data-act="del" hidden></button></div>
 </div>
</div>
<div id="st" class="ov" hidden>
 <div class="sheet" role="dialog">
  <div class="mh"><h2 data-i="set"></h2><div class="mr"><button class="nb" data-act="closeset" aria-label="Back">‹</button><button class="nb done" data-act="setdone" data-i="done"></button></div></div>
  <label><span data-i="nm"></span><input id="s-name" maxlength="24" autocomplete="off"></label>
  <label><span data-i="lang"></span><select id="s-lang"><option value="ro">Română</option><option value="en">English</option></select></label>
  <label><span data-i="cur"></span><select id="s-cur"><option>RON</option><option>EUR</option><option>USD</option><option>GBP</option><option>MDL</option></select></label>
  <p class="hint" data-i="curh"></p>
  <button class="menu" data-act="bkopen"><span data-i="bk"></span><span>›</span></button>
  
 </div>
</div>
<div id="bkp" class="ov" hidden>
 <div class="sheet" role="dialog">
  <div class="mh"><h2 data-i="bk"></h2><div class="mr"><button class="nb" data-act="closebk" aria-label="Back">‹</button></div></div>
  <p class="hint" data-i="bkh"></p>
  <textarea id="bk" rows="8" spellcheck="false"></textarea>
  <div id="msg" class="msg"></div>
  <div class="btns"><button data-act="copy" data-i="copy"></button><button id="imp" data-act="imp"></button></div>
  
 </div>
</div>
<script>
const KEY='cheltuieli_v1',KEY2='cheltuieli_set';
const T={
ro:{app:'Cheltuieli',bal:'Sold',inc:'Venituri',exp:'Cheltuieli',list:'Tranzacții',stat:'Statistici',none:'Nicio tranzacție în această lună.<br>Apasă + ca să adaugi prima.',noexp:'Nicio cheltuială în această lună.',tot:'Total cheltuieli',last:'Luna trecută',nolast:'Nu există date pentru luna trecută.',e1:'Cheltuială',i1:'Venit',amt:'Sumă',cat:'Categorie',date:'Data',note:'Notă (opțional)',save:'Salvează',cancel:'Anulează',del:'Șterge',sure:'Sigur? Apasă din nou',eamt:'Introdu o sumă mai mare ca 0, de exemplu 25,50.',edate:'Alege data.',set:'Setări',lang:'Limbă',cur:'Monedă',curh:'Schimbarea monedei modifică doar afișarea, nu convertește sumele.',bk:'Backup și import',bkh:'Copiază textul și păstrează-l (de exemplu în Notițe). Pentru restaurare, lipește-l aici și apasă Importă.',copy:'Copiază',copied:'Copiat.',manual:'Selectează textul și copiază-l manual.',imp:'Importă din text',impsure:'Sigur? Înlocuiește datele',impok:'Importat: {n} tranzacții.',impbad:'Text invalid. Lipește tot backup-ul, exact cum a fost copiat.',close:'Închide',nostore:'Stocarea nu e disponibilă în acest browser. Datele se pierd la închidere; folosește Setări → Backup.',add:'Adaugă tranzacție',back:'Înapoi',done:'Gata',txt:'Tranzacție',nm:'Numele tău',nmp:'Cum te cheamă?',gm:'Bună dimineața',ga:'Bună ziua',ge:'Bună seara',hom:'Prezentare',his:'Istoric',spent:'din venituri',ofexp:'din cheltuieli',over:'Cheltuielile depășesc veniturile cu',left:'Rămas din venituri',noinc:'Nu ai venituri în această lună, deci procentele sunt calculate din cheltuieli.',top:'Cea mai mare cheltuială',p1:'De plătit',due:'Scadență',pl:'De plătit',plnone:'Nimic planificat. Când adaugi o tranzacție, alege „De plătit”.',paid:'Plătit?',late:'întârziat',prev:'Luna anterioară',next:'Luna următoare',next_pay:'Următoarea: '},
en:{app:'Expenses',bal:'Balance',inc:'Income',exp:'Expenses',list:'Transactions',stat:'Statistics',none:'No transactions this month.<br>Tap + to add the first one.',noexp:'No expenses this month.',tot:'Total expenses',last:'Last month',nolast:'No data for last month.',e1:'Expense',i1:'Income',amt:'Amount',cat:'Category',date:'Date',note:'Note (optional)',save:'Save',cancel:'Cancel',del:'Delete',sure:'Sure? Tap again',eamt:'Enter an amount above 0, for example 25.50.',edate:'Pick a date.',set:'Settings',lang:'Language',cur:'Currency',curh:'Changing the currency only changes how amounts are shown. It does not convert them.',bk:'Backup and import',bkh:'Copy the text and keep it somewhere safe (for example in Notes). To restore, paste it here and tap Import.',copy:'Copy',copied:'Copied.',manual:'Select the text and copy it manually.',imp:'Import from text',impsure:'Sure? This replaces your data',impok:'Imported: {n} transactions.',impbad:'Invalid text. Paste the whole backup exactly as it was copied.',close:'Close',nostore:'Storage is not available in this browser. Data is lost when you close it; use Settings → Backup.',add:'Add transaction',back:'Back',done:'Done',txt:'Transaction',nm:'Your name',nmp:'What should I call you?',gm:'Good morning',ga:'Good afternoon',ge:'Good evening',hom:'Overview',his:'History',spent:'of income',ofexp:'of expenses',over:'Expenses exceed income by',left:'Left from income',noinc:'No income this month, so percentages are based on expenses.',top:'Biggest expense',p1:'To pay',due:'Due date',pl:'Upcoming',plnone:'Nothing planned. When adding a transaction, choose “To pay”.',paid:'Paid?',late:'overdue',prev:'Previous month',next:'Next month',next_pay:'Next: '}
};
const CN={'Mâncare':'Food','Subscripții':'Subscriptions','Combustibil':'Fuel','Facturi':'Bills','Casă':'Home','Sănătate':'Health','Distracție':'Fun','Cumpărături':'Shopping','Altele':'Other','Salariu':'Salary'};
const CATS={exp:['Mâncare','Subscripții','Combustibil','Facturi','Casă','Sănătate','Distracție','Cumpărături','Altele'],inc:['Salariu','Bonus','Altele']};
let S={lang:'ro',cur:'RON',name:''},tx=[],pl=[],pa=0,edPlan=false,ok=true,view=new Date(),tab='home',edId=null,type='exp',armed='',planOpen=false;
view.setDate(1);
const $=s=>document.querySelector(s);
const t=k=>T[S.lang][k];
const loc=()=>S.lang==='en'?'en-US':'ro-RO';
const cn=c=>S.lang==='en'&&CN[c]||c;
const p2=n=>String(n).padStart(2,'0');
const mk=d=>d.getFullYear()+'-'+p2(d.getMonth()+1);
const today=()=>mk(new Date())+'-'+p2(new Date().getDate());
const fmt=n=>{try{return n.toLocaleString(loc(),{style:'currency',currency:S.cur})}catch(e){return n.toFixed(2)+' '+S.cur}};
const fd=s=>new Date(s+'T00:00:00').toLocaleDateString(loc(),{day:'2-digit',month:'2-digit',year:'numeric'});
const mt=d=>{const s=d.toLocaleDateString(loc(),{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=(a,y)=>a.filter(x=>x.type===y).reduce((s,x)=>s+x.amt,0);
const err=m=>{$('#err').textContent=m};

function load(){
 try{localStorage.setItem('_t','1');localStorage.removeItem('_t');
  const r=localStorage.getItem(KEY);
  if(r){const o=JSON.parse(r);U=+o.u||((o.tx&&o.tx.length)||(o.planned&&o.planned.length)?1:0);if(Array.isArray(o.tx))tx=o.tx;if(Array.isArray(o.planned))pl=o.planned}
  const q=JSON.parse(localStorage.getItem(KEY2)||'{}');
  if(T[q.lang])S.lang=q.lang;
  if(['RON','EUR','USD','GBP','MDL'].includes(q.cur))S.cur=q.cur;
  if(typeof q.name==='string')S.name=q.name.slice(0,24);
 }catch(e){ok=false}
}
let U=0,DB=null,pushT=0;
function wr(){try{localStorage.setItem(KEY,JSON.stringify({tx,planned:pl,u:U}))}catch(e){ok=false}}
function push(){
 if(!DB)return;clearTimeout(pushT);
 pushT=setTimeout(()=>{try{DB.set({tx,planned:pl,set:{lang:S.lang,cur:S.cur,name:S.name},u:U}).catch(e=>console.error('db',e))}catch(e){console.error('db',e)}},500);
}
function save(){U=Date.now();wr();push()}
function saveSet(){U=Date.now();try{localStorage.setItem(KEY2,JSON.stringify(S))}catch(e){}wr();push()}

function applyStatic(){
 document.documentElement.lang=S.lang;
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 $('.fab').setAttribute('aria-label',t('add'));$('#l-amt').textContent=t('amt')+' ('+S.cur+')';
 $('#f-amt').placeholder=S.lang==='en'?'0.00':'0,00';
 $('#imp').textContent=t('imp');$('#imp').classList.remove('dng');
 $('#del').textContent=t('del');$('#del').classList.remove('dng');
 $('#s-name').value=S.name;$('#s-name').placeholder=t('nmp');$('#s-lang').value=S.lang;$('#s-cur').value=S.cur;armed='';dl();
}

function render(){
 armed='';
 const m=tx.filter(x=>x.date.startsWith(mk(view)));
 const inc=sum(m,'inc'),exp=sum(m,'exp'),bal=inc-exp,hr=new Date().getHours();
 let h=(ok||DB)?'':`<div class="warn">${t('nostore')}</div>`;
 h+=`<div class="hd"><div><small>${t('app')}</small><h2>${t(hr<12?'gm':hr<18?'ga':'ge')}${S.name?', '+esc(S.name):''} 👋</h2></div><button class="gear" data-act="set" aria-label="${t('set')}">⚙️</button></div>`;
 const an=mAnim?(mAnim>0?' mir':' mil'):'';
 h+=`<div id="top" class="top${an}"><div class="nav"><button data-act="prev" aria-label="${t('prev')}">‹</button><h1>${mt(view)}</h1><button data-act="next" aria-label="${t('next')}">›</button></div>`;
 h+=`<div class="sum"><span>${t('bal')}</span><div class="big">${fmt(bal)}</div><div class="two"><div><span>↑ ${t('inc')}</span><b>${fmt(inc)}</b></div><div><span>↓ ${t('exp')}</span><b>${fmt(exp)}</b></div></div></div></div>`;
 h+=`<div class="pager${an}${mAnim?' noanim':''}" id="pgr"><div class="track" id="trk"><section class="pane" id="p-home">${planCard()+charts(m,inc,exp)}</section><section class="pane" id="p-hist">${list(m)}</section></div></div>`;
 $('#app').innerHTML=h;
 document.querySelectorAll('.dock button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
 place(false);
}
let offT=0,mAnim=0,busy=false;
function ind(p,anim){const e=$('.ind');if(!e)return;e.style.transition=anim?'transform .38s cubic-bezier(.22,.8,.3,1)':'none';e.style.transform=`translateX(calc(${p*100}% + ${p*4}px))`}
function goMonth(d){view.setMonth(view.getMonth()+d);mAnim=d;render();mAnim=0}
function setOff(){const a=$('#p-home'),b=$('#p-hist');if(a)a.classList.toggle('off',tab!=='home');if(b)b.classList.toggle('off',tab!=='hist')}
function place(anim){
 const tr=$('#trk');if(!tr)return;
 tr.style.transition=anim?'transform .38s cubic-bezier(.22,.8,.3,1)':'none';
 tr.style.transform=`translateX(${tab==='hist'?-50:0}%)`;
 ind(tab==='hist'?1:0,anim);
 clearTimeout(offT);
 if(anim){$('#p-home').classList.remove('off');$('#p-hist').classList.remove('off');offT=setTimeout(setOff,430)}else setOff();
}
function switchTab(k){
 if(k!==tab){tab=k;window.scrollTo(0,0)}
 document.querySelectorAll('.dock button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
 place(true);
}
let sx=0,sy=0,dx=0,lk='',zn='';
document.addEventListener('touchstart',e=>{
 zn=e.target.closest('.pager')?'p':e.target.closest('#top')?'t':'';
 if(!zn||e.touches.length!==1||busy){lk='x';return}
 sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;lk='';
},{passive:true});
document.addEventListener('touchmove',e=>{
 if(lk==='x'||lk==='v')return;
 const x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;
 if(!lk){
  if(Math.abs(x)<8&&Math.abs(y)<8)return;
  lk=Math.abs(x)>Math.abs(y)?'h':'v';
  if(lk==='h'){
   if(zn==='p'){$('#p-home').classList.remove('off');$('#p-hist').classList.remove('off');$('#trk').style.transition='none'}
   else $('#top').style.transition='none';
  }
 }
 if(lk!=='h')return;
 if(zn==='p'){
  const i=tab==='hist'?1:0,w=$('#pgr').offsetWidth;
  dx=((i===0&&x>0)||(i===1&&x<0))?x*.3:x;
  $('#trk').style.transform=`translateX(calc(${-i*50}% + ${dx}px))`;
  ind(Math.min(1,Math.max(0,i-dx/w)),false);
 }else{dx=x;$('#top').style.transform=`translateX(${dx}px)`}
},{passive:true});
function endTouch(){
 if(lk==='h'){const w=window.innerWidth;
  if(zn==='p'){
   if(dx<-w*.18&&tab==='home')switchTab('hist');
   else if(dx>w*.18&&tab==='hist')switchTab('home');
   else place(true);
  }else if(Math.abs(dx)>w*.2)goMonth(dx<0?1:-1);
  else{const el=$('#top');el.style.transition='transform .25s ease-out';el.style.transform='translateX(0)'}
 }
 lk='';dx=0;
}
document.addEventListener('touchend',endTouch);
document.addEventListener('touchcancel',endTouch);

function togglePlan() {
 planOpen = !planOpen;
 render();
}

function planCard(){
 const q=[...pl].sort((a,b)=>a.date.localeCompare(b.date)),td=today();
 const totalAmt = q.reduce((a,x)=>a+x.amt,0);
 const nextPay = q.length > 0 ? `${esc(cn(q[0].cat))} (${fmt(q[0].amt)})` : '';
 
 let h=`<div class="plan ${planOpen ? 'open' : ''}">
        <div class="plan-head" data-act="togglePlan">
         <h3>🗓️ ${t('pl')}</h3>
         <div class="plan-info">
          <span class="amt">${q.length ? fmt(totalAmt) : ''} <span class="chevron">▼</span></span>
          ${q.length ? `<span class="next">${t('next_pay')}${nextPay}</span>` : ''}
         </div>
        </div>
        <div class="plan-body">`;
 
 if(!q.length) h+=`<p class="hint">${t('plnone')}</p>`;
 
 q.forEach(x=>{const late=x.date<td;
  h+=`<div class="pr"><button class="row" data-act="edit" data-plan="1" data-id="${x.id}">${ic(x)}<span class="rt"><b>${esc(cn(x.cat))}</b><small class="${late?'late':''}">${fd(x.date)}${late?' · '+t('late'):''}${x.note?' · '+esc(x.note):''}</small></span><em class="r">${fmt(x.amt)}</em></button><button class="pay${pa===x.id?' pri':''}" data-act="pay" data-id="${x.id}" aria-label="${t('paid')}">${pa===x.id?t('paid'):'✓'}</button></div>`});
 return h+'</div></div>';
}

function payPlan(id){
 if(pa!==id){pa=id;render();return}
 const x=pl.find(r=>r.id===id);pa=0;
 if(x){pl=pl.filter(r=>r.id!==id);tx.push({id:x.id,type:'exp',amt:x.amt,cat:x.cat,date:today(),note:x.note});save()}
 render();
}
function dl(){$('#l-date').textContent=t(type==='plan'?'due':'date')}

function list(m){
 if(!m.length)return `<p class="empty"><span class="pig">🐷</span>${t('none')}</p>`;
 const s=[...m].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 let h='',d='';
 for(const x of s){
  if(x.date!==d){d=x.date;h+=`<div class="day">${fd(d)}</div>`}

const EM={'Mâncare':'🍽️','Subscripții':'🔄','Combustibil':'⛽','Facturi':'🧾','Casă':'🏠','Sănătate':'💊','Distracție':'🎮','Cumpărături':'🛍️','Altele':'✨','Salariu':'💼','Bonus':'🎁'};
const ic=x=>{const c=x.type==='inc'?'#16a34a':cc(x.cat);return `<i class="ic" style="background:${c}2e">${EM[x.cat]||'✨'}</i>`};
const COL=['#0f766e','#0284c7','#ea580c','#d97706','#7c3aed','#db2777','#65a30d','#dc2626','#64748b'];
const cc=c=>{const i=CATS.exp.indexOf(c);return COL[i<0?8:i]};
const pc=n=>n.toLocaleString(loc(),{maximumFractionDigits:1})+'%';
function charts(m,inc,exp){
 const by={};
 m.filter(x=>x.type==='exp').forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amt);
 const e=Object.entries(by).sort((a,b)=>b[1]-a[1]);
 if(!e.length)return `<p class="empty"><span class="pig">📊</span>${t('noexp')}</p>`;
 const base=inc>0?Math.max(inc,exp):exp,den=inc>0?inc:exp,R=44,C=2*Math.PI*R;
 
 // Calcul procent disponibil pentru Chart
 const percentAvail = inc > 0 ? (inc >= exp ? Math.round(((inc - exp) / inc) * 100) : 0) : 0;
 const centerText = inc > 0 ? `${percentAvail}%` : '100%';
 const subText = inc > 0 ? 'disponibil' : t('ofexp');
 
 let off=0,svg=`<svg class="donut" viewBox="0 0 120 120" role="img" aria-label="${t('spent')}"><circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--bd)" stroke-width="18"/>`;
 
 // Adaugam zona verde pentru disponibil in grafic daca exista venit
 if (inc > 0 && inc >= exp) {
    const availLength = (percentAvail / 100) * C;
    svg += `<circle cx="60" cy="60" r="${R}" fill="none" stroke="#22c55e" stroke-width="18" stroke-dasharray="${availLength} ${C - availLength}" stroke-dashoffset="0" transform="rotate(-90 60 60)"/>`;
    off += availLength;
 }

 e.forEach(([c,v])=>{const l=v/base*C;svg+=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${cc(c)}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=l});
 svg+=`<text x="60" y="60" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">${centerText}</text><text x="60" y="76" text-anchor="middle" font-size="9" fill="currentColor" opacity=".7">${subText}</text></svg>`;
 let h=`<div class="card">${svg}`;
 if(inc>0)h+=exp>inc?`<p class="note over">${t('over')} ${fmt(exp-inc)}</p>`:`<p class="note">${t('left')}: <b>${fmt(inc-exp)}</b> (${pc((inc-exp)/inc*100)})</p>`;
 else h+=`<p class="note">${t('noinc')}</p>`;
 h+=`<p class="note">${t('top')}: <b>${esc(cn(e[0][0]))}</b> (${pc(e[0][1]/den*100)})</p>`;
 e.forEach(([c,v])=>{const p=v/den*100;h+=`<div class="bar"><div class="bl"><span class="lg"><i class="dot" style="background:${cc(c)}"></i>${EM[c]||'✨'} ${esc(cn(c))}</span><span>${fmt(v)} · ${pc(p)}</span></div><div class="tr"><i style="width:${Math.min(p,100)}%;background:${cc(c)}"></i></div></div>`});
 const pv=new Date(view);pv.setMonth(pv.getMonth()-1);
 const pt=sum(tx.filter(x=>x.date.startsWith(mk(pv))),'exp');
 h+=`<p class="note">${t('last')}: ${pt?`${fmt(pt)} (${exp>=pt?'+':'−'}${fmt(Math.abs(exp-pt))})`:t('nolast')}</p>`;
 return h+'</div>';
}
